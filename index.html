<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="ipseite 선수 앱·관리자 웹·선수 웹 디자인 시안"
    />
    <title>ipseite 디자인 시안</title>
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="share.css" />
    <script type="module" src="gallery.js"></script>
  </head>
  <body>
    <a class="skip" href="#pages">페이지 목록으로</a>
    <header class="share-header">
      <a href="./" class="wordmark"
        ><img
          src="assets/logo-lockup.svg"
          alt="IPSÉITÉ"
          width="712"
          height="154" /></a
      ><span>디자인 시안</span><span class="edition">2026.11.04</span>
    </header>
    <main class="share-main">
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">선수 앱 · 관리자·지도자 웹 · 선수 웹</p>
          <h1 id="page-title">ipseite 디자인 시안</h1>
        </div>
        <p class="sample-note">예시 데이터 사용</p>
      </section>
      <details class="direction" open>
        <summary>디자인 기준</summary>
        <div id="principles" class="principles"></div>
      </details>
      <section id="pages" aria-labelledby="pages-title">
        <div class="section-heading">
          <h2 id="pages-title">화면 목록</h2>
          <p id="result-count" aria-live="polite"></p>
        </div>
        <div class="catalog-toolbar">
          <nav class="category-tabs" aria-label="화면 종류"></nav>
          <label class="search"
            ><span>화면 검색</span
            ><input
              type="search"
              placeholder="예: 측정, 비교, 프로필"
              aria-label="화면 검색"
          /></label>
        </div>
        <div id="screen-grid" class="screen-grid"></div>
        <p id="empty" class="empty" hidden>검색 결과가 없어요.</p>
      </section>
      <footer class="share-footer">IPSÉITÉ</footer>
    </main>
    <dialog id="viewer" aria-labelledby="viewer-title">
      <div class="viewer-toolbar">
        <a class="wordmark" href="./">ipséité</a
        ><span id="viewer-position"></span
        ><button id="close-viewer" class="icon-button" aria-label="화면 닫기">
          ×
        </button>
      </div>
      <div class="viewer-body">
        <div class="screen-stage">
          <div class="screen-image-wrap"><img id="viewer-image" alt="" /></div>
        </div>
        <aside class="viewer-notes">
          <p id="viewer-category" class="eyebrow"></p>
          <h2 id="viewer-title"></h2>
          <p id="viewer-description"></p>
          <h3>화면 구성</h3>
          <ul id="viewer-rules"></ul>
          <a id="full-image" class="text-link" target="_blank" rel="noopener"
            >이미지 원본 보기 ↗</a
          >
          <nav class="viewer-pagination" aria-label="다른 화면">
            <button id="previous-screen">← 이전 화면</button
            ><button id="next-screen">다음 화면 →</button>
          </nav>
        </aside>
      </div>
    </dialog>
  </body>
</html>
